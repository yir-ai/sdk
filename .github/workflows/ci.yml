name: SDK checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Contracts, packages and Go
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOWORK: 'off'
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Enable pinned pnpm
        working-directory: typescript
        run: |
          corepack enable
          corepack prepare pnpm@10.30.1 --activate
      - name: Install TypeScript dependencies
        working-directory: typescript
        run: pnpm install --frozen-lockfile
      - name: Check contracts, tests, types and archive installation
        working-directory: typescript
        run: pnpm check
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go/go.mod
          cache: false
      - name: Test standalone Go module
        shell: bash
        run: |
          module_dir=$(mktemp -d "$RUNNER_TEMP/yir-go-XXXXXX")
          cp -a go/. "$module_dir/"
          cd "$module_dir"
          go test -p 2 ./...
