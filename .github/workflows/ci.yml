name: SDK checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Contracts, packages and Go
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOWORK: 'off'
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Enable pinned pnpm
        working-directory: typescript
        run: |
          corepack enable
          corepack prepare pnpm@10.30.1 --activate
      - name: Install TypeScript dependencies
        working-directory: typescript
        run: pnpm install --frozen-lockfile
      - name: Check contracts, tests, types and archive installation
        working-directory: typescript
        run: pnpm check
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go/go.mod
          cache: false
      - name: Test standalone Go module
        shell: bash
        run: |
          module_dir=$(mktemp -d "$RUNNER_TEMP/yir-go-XXXXXX")
          cp -a go/. "$module_dir/"
          cd "$module_dir"
          go test -p 2 ./...
